name: CI Ubuntu 24/7 (Password Protected)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  repository_dispatch:
    types: [ restart_ubuntu ]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Purana data backup load karna
      - name: Restore Data Backup
        uses: actions/cache/restore@v4
        with:
          path: ./my-vps-data
          key: vps-data-backup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vps-data-backup-

      # 2. Safety configurations aur password logic setup
      - name: Setup Password Protection
        run: |
          mkdir -p ./my-vps-data
          
          # .bashrc me simple validation code inject karna
          # Yahan 'MerePass123!' ki jagah aap apna custom password rakh sakte hain
          echo 'if [ -z "$SECURE_GATE_PASSED" ]; then' >> ~/.bashrc
          echo '    clear' >> ~/.bashrc
          echo '    echo "======================================================"' >> ~/.bashrc
          echo '    echo "🔒 SECURITY ALERT: ENTER MAIN VPS PASSWORD TO ACCESS"' >> ~/.bashrc
          echo '    echo "======================================================"' >> ~/.bashrc
          echo '    read -s -p "Password: " input_pass' >> ~/.bashrc
          echo '    echo ""' >> ~/.bashrc
          echo '    if [ "$input_pass" = "adminop!" ]; then' >> ~/.bashrc
          echo '        export SECURE_GATE_PASSED=1' >> ~/.bashrc
          echo '        clear' >> ~/.bashrc
          echo '        echo "✅ Access Granted! Welcome back."' >> ~/.bashrc
          echo '    else' >> ~/.bashrc
          echo '        echo "❌ Wrong Password! Connection Closing..."' >> ~/.bashrc
          echo '        sleep 2' >> ~/.bashrc
          echo '        exit 1' >> ~/.bashrc
          echo '    fi' >> ~/.bashrc
          echo 'fi' >> ~/.bashrc

      # 3. Main SSHX Terminal with safe exit handler
      - name: Run SSHX Terminal
        run: |
          echo "Starting sshx session..."
          # timeout khatam hone par ye automatic band ho kar code 0 dega taaki pipeline fail na ho
          timeout 350m sh -c 'curl -sSf https://sshx.io | sh -s run' || true

      # 4. Data auto save karna clone close hone se pehle (Hamesha chalega)
      - name: Save Updated Data Backup
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./my-vps-data
          key: vps-data-backup-${{ github.run_id }}-${{ github.run_attempt }}

      # 5. Perfect automatic loop trigger (Hamesha chalega aur naya flow uthayega)
      - name: Auto Loop Trigger
        if: always()
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/dispatches \
            -d '{"event_type": "restart_ubuntu"}'
