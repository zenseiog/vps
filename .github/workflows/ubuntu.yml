name: CI Ubuntu 24/7

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  # Loop ko maintain rakhne ke liye event handler
  repository_dispatch:
    types: [ restart_ubuntu ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run SSHX with Timeout
        run: |
          echo "Starting sshx session..."
          # Isko max 350 minutes tak chalayenge taaki 6h limit se pehle safely exit ho sake
          timeout 350m sh -c 'curl -sSf https://sshx.io/get | sh -s run' || true
          echo "Session timed out safely, preparing to restart..."

      # GitHub API ka use karke yeh step is workflow ko turant fir se start kar dega
      - name: Auto Loop Trigger
        if: always()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/dispatches \
            -d '{"event_type": "restart_ubuntu"}'
