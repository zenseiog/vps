name: CI Debian 24/7

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  repository_dispatch:
    types: [ restart_debian ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Debian folder ka data backup restore karega
      - name: Restore Debian Data Backup
        uses: actions/cache/restore@v4
        with:
          path: |
            ./debian-vps-data
          key: debian-data-backup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            debian-data-backup-

      # 2. Debian docker container ke andar tmate launch
      - name: Run Tmate inside Debian Container
        run: |
          mkdir -p ./debian-vps-data
          echo "Starting Tmate inside Debian Docker Environment..."
          
          # Container ke andar backup folder ko mount kiya hai taaki data container ke bahar safe rahe
          timeout 350m docker run --rm \
            -v ${{ github.workspace }}/debian-vps-data:/workspace \
            debian:13-slim sh -c "
              apt-get update && apt-get install -y tmate curl &&
              tmate -S /tmp/tmate.sock new-session -d &&
              tmate -S /tmp/tmate.sock wait tmate &&
              echo '==========================================================' &&
              echo '👉 DEBIAN TERMINAL LINK:' &&
              tmate -S /tmp/tmate.sock display -p '#{tmate_web}' &&
              echo '==========================================================' &&
              sleep 345m
            " || true
          echo "Session complete, updating backup and restarting..."

      # 3. Debian ka data update hone par cache me save karega
      - name: Save Updated Debian Data Backup
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ./debian-vps-data
          key: debian-data-backup-${{ github.run_id }}-${{ github.run_attempt }}

      # 4. Debian automatic loop handler
      - name: Auto Loop Trigger
        if: always()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/dispatches \
            -d '{"event_type": "restart_debian"}'
