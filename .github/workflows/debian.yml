name: CI Debian 24/7

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  repository_dispatch:
    types: [ restart_debian ]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Debian backup ko restore karna
      - name: Restore Debian Data Backup
        uses: actions/cache/restore@v4
        with:
          path: |
            ./debian-vps-data
          key: debian-data-backup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            debian-data-backup-

      # 2. Debian Container ke andar SSH aur Ngrok link setup
      - name: Run Debian Environment with Tunnel
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          mkdir -p ./debian-vps-data
          
          # Container launch karne se pehle host par ngrok config banna
          sudo apt-get update && sudo apt-get install -y snapd
          sudo snap install ngrok
          ngrok config add-authtoken "$NGROK_TOKEN"
          
          # Background me Ngrok port 2222 ke liye start karna
          ngrok tcp 2222 --log=stdout > ngrok.log &
          sleep 5
          
          # Docker ke andar Debian me SSH config karna
          timeout 350m docker run --rm \
            -v ${{ github.workspace }}/debian-vps-data:/workspace \
            -p 2222:22 \
            debian:13-slim sh -c "
              apt-get update && apt-get install -y openssh-server curl &&
              mkdir /var/run/sshd &&
              echo 'root:DebianPass123!' | chpasswd &&
              sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config &&
              /usr/sbin/sshd -D
            " || true

      # 3. Data update save karna
      - name: Save Updated Debian Data Backup
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ./debian-vps-data
          key: debian-data-backup-${{ github.run_id }}-${{ github.run_attempt }}

      # 4. Debian auto loop
      - name: Auto Loop Trigger
        if: always()
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/dispatches \
            -d '{"event_type": "restart_debian"}'
